name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version in `packageManager` and caches the pnpm store.
      # The action also puts a Node.js matching `devEngines.runtime` on PATH,
      # but `pnpm run` uses the runtime that the Install step links.
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: false

      # Unlike the action's own install, which passes `--no-runtime`, this links
      # the Node.js version locked in pnpm-lock.yaml, as local installs do.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # oxlint-config's lint and profile tests run Oxlint with the built @sonsu-lee/oxlint-plugin.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
